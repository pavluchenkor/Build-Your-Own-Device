<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Oscilloscope probe connection and PWM waveform</title>
  <desc id="desc">Oscilloscope probe tip on signal, ground clip on GND. Right side shows a typical PWM waveform with period, duty cycle and amplitude labels.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .scope { fill: #1e293b; stroke: #334155; stroke-width: 2; }
      .screen { fill: #0f172a; stroke: #475569; stroke-width: 2; }
      .mcu { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .probe-body { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
      .wire-probe { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .wire-gnd { stroke: #1e293b; stroke-width: 3; fill: none; }
      .pwm { stroke: #4ade80; stroke-width: 3; fill: none; }
      .grid { stroke: #1e3a5f; stroke-width: 1; fill: none; }
      .axis { stroke: #475569; stroke-width: 1; fill: none; }
      .label { font: bold 16px Arial, sans-serif; fill: #1e293b; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; }
      .screen-text { font: 12px Arial, sans-serif; fill: #4ade80; }
      .dim-line { stroke: #f59e0b; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .dim-text { font: 12px Arial, sans-serif; fill: #f59e0b; }
      .warn-text { font: bold 13px Arial, sans-serif; fill: #dc2626; }
    </style>
  </defs>

  <!-- LEFT SIDE: Connection diagram -->

  <!-- Oscilloscope body -->
  <rect x="30" y="80" width="220" height="200" rx="12" class="scope"/>
  <text x="140" y="108" text-anchor="middle" font="bold 15px Arial" fill="#94a3b8" font-size="15" font-family="Arial" font-weight="bold">OSCILLOSCOPE</text>
  <!-- Screen -->
  <rect x="50" y="115" width="180" height="100" rx="4" class="screen"/>
  <!-- Simple PWM on screen -->
  <polyline points="55,190 55,140 80,140 80,190 115,190 115,140 150,140 150,190 185,190 185,140 210,140 210,190 225,190" class="pwm" stroke-width="2"/>
  <!-- CH1 input -->
  <circle cx="90" cy="270" r="12" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="90" y="275" text-anchor="middle" font="bold 11px Arial" fill="white" font-size="11" font-family="Arial" font-weight="bold">CH1</text>
  <!-- Probe cable -->
  <path d="M90 282 L90 340 L280 340" class="wire-probe"/>

  <!-- Probe body -->
  <rect x="280" y="325" width="60" height="30" rx="6" class="probe-body"/>
  <text x="310" y="345" text-anchor="middle" class="small">10x</text>
  <!-- Probe tip -->
  <path d="M340 340 L390 340 L390 260" class="wire-probe" marker-end="url(#arrow)"/>
  <!-- Ground clip -->
  <path d="M310 355 L310 390 L430 390 L430 310" class="wire-gnd" marker-end="url(#arrow)"/>
  <rect x="295" y="350" width="30" height="15" rx="4" fill="#475569"/>
  <text x="310" y="362" text-anchor="middle" font="10px Arial" fill="white" font-size="10" font-family="Arial">GND</text>

  <!-- MCU block -->
  <rect x="370" y="180" width="160" height="160" rx="10" class="mcu"/>
  <text x="450" y="210" text-anchor="middle" class="label">MCU</text>
  <!-- Signal pin dot -->
  <circle cx="370" cy="260" r="7" fill="#7c3aed"/>
  <text x="360" y="258" text-anchor="end" class="text" fill="#7c3aed">PWM</text>
  <!-- GND pin dot -->
  <circle cx="370" cy="310" r="7" fill="#1e293b"/>
  <text x="360" y="308" text-anchor="end" class="text">GND</text>

  <!-- Safety warning -->
  <rect x="30" y="305" width="330" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="50" y="325" class="warn-text">! Scope GND = mains earth</text>
  <text x="50" y="345" class="text" fill="#7f1d1d" font-size="13">Never clip ground to AC mains or</text>
  <text x="50" y="360" class="text" fill="#7f1d1d" font-size="13">high-voltage nodes.</text>

  <!-- DIVIDER -->
  <line x1="545" y1="60" x2="545" y2="440" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- RIGHT SIDE: PWM waveform explanation -->
  <text x="750" y="85" text-anchor="middle" class="label" font-size="18">PWM Waveform</text>

  <!-- Waveform area -->
  <rect x="570" y="100" width="360" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="570" y1="160" x2="930" y2="160" class="grid"/>
  <line x1="570" y1="220" x2="930" y2="220" class="grid"/>
  <line x1="660" y1="100" x2="660" y2="320" class="grid"/>
  <line x1="750" y1="100" x2="750" y2="320" class="grid"/>
  <line x1="840" y1="100" x2="840" y2="320" class="grid"/>

  <!-- Zero line -->
  <line x1="570" y1="270" x2="930" y2="270" class="axis"/>
  <text x="565" y="274" text-anchor="end" class="screen-text" font-size="11">0V</text>

  <!-- PWM waveform: 50% duty cycle example -->
  <polyline points="580,270 580,130 660,130 660,270 750,270 750,130 840,130 840,270 920,270" class="pwm"/>

  <!-- Amplitude annotation -->
  <line x1="935" y1="130" x2="935" y2="270" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="945" y="210" class="dim-text">3.3V</text>

  <!-- Period annotation -->
  <line x1="580" y1="340" x2="750" y2="340" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="665" y="358" text-anchor="middle" class="dim-text">period T</text>
  <text x="665" y="373" text-anchor="middle" class="dim-text">f = 1/T</text>

  <!-- Duty cycle annotation -->
  <line x1="580" y1="360" x2="660" y2="360" class="dim-line"/>
  <text x="620" y="390" text-anchor="middle" class="dim-text">HIGH time</text>
  <text x="620" y="405" text-anchor="middle" class="dim-text">duty = 50%</text>

  <!-- Labels on waveform -->
  <text x="615" y="122" text-anchor="middle" class="screen-text" font-size="11">HIGH</text>
  <text x="705" y="262" text-anchor="middle" class="screen-text" font-size="11">LOW</text>

  <!-- Key metrics box -->
  <rect x="570" y="415" width="360" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="750" y="435" text-anchor="middle" class="label" font-size="13">Read on oscilloscope: frequency, duty %, amplitude, shape</text>
  <text x="750" y="455" text-anchor="middle" class="text" font-size="12">Multimeter shows only average voltage — oscilloscope shows the full signal.</text>
</svg>
