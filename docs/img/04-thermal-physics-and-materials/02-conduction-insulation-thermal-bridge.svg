<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Теплопроводность и тепловой мост</title>
  <desc id="desc">Сравнение теплопроводной металлической детали и утеплённой стенки с металлическим винтом, который создаёт тепловой мост.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d84a2b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f72b7"/>
    </marker>
    <pattern id="insulation" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 12 C5 2, 12 22, 18 8" fill="none" stroke="#9f8d56" stroke-width="2"/>
    </pattern>
    <linearGradient id="hotWall" x1="0" x2="1">
      <stop offset="0" stop-color="#f9c18f"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
  </defs>

  <rect width="980" height="520" fill="#f7f9fc"/>
  <text x="490" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2733">Куда уходит тепло через материалы</text>

  <g transform="translate(60 95)">
    <rect x="0" y="0" width="395" height="360" rx="14" fill="#ffffff" stroke="#d8dee8"/>
    <text x="197" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d2733">Металл распределяет тепло</text>

    <rect x="44" y="120" width="68" height="150" rx="8" fill="#e85b36"/>
    <text x="78" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Нагрев</text>

    <rect x="112" y="145" width="230" height="100" rx="8" fill="url(#hotWall)" stroke="#9ca7b6" stroke-width="2"/>
    <text x="227" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#324052">Алюминиевая пластина</text>

    <path d="M128 172 C170 150, 220 150, 260 172" fill="none" stroke="#d84a2b" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M128 220 C180 250, 252 250, 314 220" fill="none" stroke="#d84a2b" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M328 170 C358 150, 370 128, 374 96" fill="none" stroke="#2f72b7" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M328 220 C358 242, 370 270, 374 304" fill="none" stroke="#2f72b7" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <text x="82" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6472">горячая зона</text>
    <text x="260" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6472">тепло быстро уходит дальше</text>
  </g>

  <g transform="translate(525 95)">
    <rect x="0" y="0" width="395" height="360" rx="14" fill="#ffffff" stroke="#d8dee8"/>
    <text x="197" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d2733">Утепление и тепловой мост</text>

    <rect x="52" y="104" width="92" height="190" rx="8" fill="#e85b36"/>
    <text x="98" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Камера</text>

    <rect x="144" y="104" width="130" height="190" rx="6" fill="url(#insulation)" stroke="#b7a66a" stroke-width="2"/>
    <text x="209" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5c4d20">Утеплитель</text>

    <rect x="274" y="104" width="56" height="190" rx="6" fill="#dfe6ef" stroke="#9ca7b6" stroke-width="2"/>
    <text x="302" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#324052" transform="rotate(-90 302 198)">Корпус</text>

    <rect x="104" y="187" width="230" height="22" rx="11" fill="#8d99a8"/>
    <circle cx="112" cy="198" r="18" fill="#b5bdc8" stroke="#6d7683" stroke-width="3"/>
    <circle cx="334" cy="198" r="18" fill="#b5bdc8" stroke="#6d7683" stroke-width="3"/>

    <path d="M128 198 C172 176, 220 176, 262 198" fill="none" stroke="#d84a2b" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M262 198 C290 190, 314 190, 338 198" fill="none" stroke="#d84a2b" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M154 118 C174 94, 205 88, 240 92" fill="none" stroke="#2f72b7" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <text x="221" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6472">винт проводит тепло через стенку</text>
    <text x="205" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6472">утеплитель снижает потери, но мост остаётся</text>
  </g>

  <g transform="translate(300 472)">
    <line x1="0" y1="0" x2="54" y2="0" stroke="#d84a2b" stroke-width="5" marker-end="url(#arrow-red)"/>
    <text x="68" y="5" font-family="Arial, sans-serif" font-size="15" fill="#394655">путь тепла</text>
    <line x1="178" y1="0" x2="232" y2="0" stroke="#2f72b7" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="246" y="5" font-family="Arial, sans-serif" font-size="15" fill="#394655">потери наружу</text>
  </g>
</svg>
