<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Heat transfer paths in a heated device</title>
  <desc id="desc">A heater inside a chamber transfers heat by conduction through a bracket, convection through airflow, and radiation toward nearby surfaces.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .chamber { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .heater { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; rx: 10; }
      .metal { fill: #e5e7eb; stroke: #4b5563; stroke-width: 2; rx: 6; }
      .part { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .conv { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .cond { fill: none; stroke: #dc2626; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .rad { fill: none; stroke: #f59e0b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="520" fill="#ffffff"/>
  <rect x="70" y="70" width="840" height="360" class="chamber"/>
  <text x="95" y="105" class="label">Heated chamber</text>

  <rect x="190" y="230" width="150" height="80" class="heater"/>
  <text x="265" y="264" text-anchor="middle" class="label">Heater</text>
  <text x="265" y="290" text-anchor="middle" class="small">hot surface</text>

  <rect x="340" y="255" width="190" height="30" class="metal"/>
  <text x="435" y="250" text-anchor="middle" class="small">metal bracket</text>

  <rect x="660" y="210" width="135" height="110" class="part"/>
  <text x="728" y="252" text-anchor="middle" class="label">Plastic</text>
  <text x="728" y="278" text-anchor="middle" class="small">nearby part</text>

  <path d="M340 270 H530" class="cond"/>
  <text x="380" y="320" class="small">conduction through solid</text>

  <path d="M260 230 C330 145 520 130 675 210" class="conv"/>
  <path d="M310 310 C420 385 590 370 695 320" class="conv"/>
  <text x="420" y="150" class="small">convection: moving air carries heat</text>

  <path d="M340 230 C445 210 540 205 660 235" class="rad"/>
  <path d="M340 290 C460 295 545 285 660 275" class="rad"/>
  <text x="455" y="214" class="small">radiation to nearby surfaces</text>

  <text x="90" y="470" class="small">Real devices usually combine all three paths. Check local hot spots, not only average chamber temperature.</text>
</svg>
