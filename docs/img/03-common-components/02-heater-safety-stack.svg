<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Слои безопасного управления нагревателем</title>
  <desc id="desc">Схема показывает цепочку питания нагревателя: источник питания, предохранитель, силовой ключ, нагреватель, датчик температуры, контроллер и независимая термозащита.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 25px Arial, sans-serif; font-weight: 700; fill: #222; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; }
      .danger { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .safe { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .logic { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .label { font: 18px Arial, sans-serif; font-weight: 700; fill: #222; }
      .text { font: 15px Arial, sans-serif; fill: #222; }
      .note { font: 14px Arial, sans-serif; fill: #555; }
      .power { stroke: #d32f2f; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .signal { stroke: #1976d2; stroke-width: 4; fill: none; stroke-dasharray: 10 7; marker-end: url(#arrow); }
      .sensor { stroke: #7b1fa2; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .cutoff { stroke: #15803d; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="520" y="42" text-anchor="middle" class="title">Нагреватель: управление и независимая защита</text>

  <rect x="45" y="125" width="155" height="95" rx="10" class="box"/>
  <text x="122" y="162" text-anchor="middle" class="label">Питание</text>
  <text x="122" y="190" text-anchor="middle" class="text">24V DC</text>
  <text x="122" y="212" text-anchor="middle" class="text">или 230V AC</text>

  <rect x="250" y="125" width="155" height="95" rx="10" class="safe"/>
  <text x="327" y="162" text-anchor="middle" class="label">Предохранитель</text>
  <text x="327" y="192" text-anchor="middle" class="text">под проводку</text>

  <rect x="455" y="125" width="155" height="95" rx="10" class="box"/>
  <text x="532" y="158" text-anchor="middle" class="label">Силовой ключ</text>
  <text x="532" y="187" text-anchor="middle" class="text">MOSFET / SSR</text>
  <text x="532" y="209" text-anchor="middle" class="text">под тип нагрузки</text>

  <rect x="660" y="125" width="155" height="95" rx="10" class="danger"/>
  <text x="737" y="162" text-anchor="middle" class="label">Нагреватель</text>
  <text x="737" y="192" text-anchor="middle" class="text">мощность + обдув</text>

  <rect x="865" y="125" width="130" height="95" rx="10" class="safe"/>
  <text x="930" y="158" text-anchor="middle" class="label">Thermal</text>
  <text x="930" y="182" text-anchor="middle" class="label">fuse</text>
  <text x="930" y="210" text-anchor="middle" class="text">независимо</text>

  <path d="M200 172 L250 172" class="power"/>
  <path d="M405 172 L455 172" class="power"/>
  <path d="M610 172 L660 172" class="power"/>
  <path d="M815 172 L865 172" class="cutoff"/>

  <rect x="230" y="350" width="180" height="95" rx="10" class="logic"/>
  <text x="320" y="386" text-anchor="middle" class="label">Контроллер</text>
  <text x="320" y="415" text-anchor="middle" class="text">Klipper / ESP32</text>

  <rect x="610" y="350" width="190" height="95" rx="10" class="logic"/>
  <text x="705" y="386" text-anchor="middle" class="label">Термодатчик</text>
  <text x="705" y="415" text-anchor="middle" class="text">в правильном месте</text>

  <path d="M365 350 C405 292 470 250 532 220" class="signal"/>
  <text x="432" y="305" text-anchor="middle" class="text" fill="#1976d2">управление</text>

  <path d="M660 350 C620 295 665 245 720 220" class="sensor"/>
  <text x="640" y="306" text-anchor="middle" class="text" fill="#7b1fa2">температура</text>

  <text x="520" y="505" text-anchor="middle" class="note">Прошивка и датчик не заменяют аппаратную термозащиту. Предохранитель выбирают под проводку и нагрузку.</text>
</svg>
