<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">STM32 printer board as Klipper MCU</title>
  <desc id="desc">A Klipper host connects to an STM32 printer board over USB, UART, or CAN. The STM32 board exposes sensor inputs and driver outputs while loads use protected power paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .host { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .board { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
      .input { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .output { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .link { fill: none; stroke: #7c3aed; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .power { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="520" fill="#ffffff"/>

  <rect x="52" y="182" width="225" height="150" class="host"/>
  <text x="165" y="224" text-anchor="middle" class="label">Klipper host</text>
  <text x="165" y="252" text-anchor="middle" class="small">Linux SBC / mini PC</text>
  <text x="165" y="278" text-anchor="middle" class="small">printer.cfg</text>
  <text x="165" y="304" text-anchor="middle" class="small">sends timed commands</text>

  <rect x="382" y="120" width="250" height="270" class="board"/>
  <text x="507" y="165" text-anchor="middle" class="label">STM32 board</text>
  <text x="507" y="193" text-anchor="middle" class="small">printer board / Nucleo / expansion</text>
  <text x="507" y="221" text-anchor="middle" class="small">3.3V MCU logic</text>
  <text x="507" y="249" text-anchor="middle" class="small">USB / UART / CAN</text>
  <text x="507" y="277" text-anchor="middle" class="small">ADC / PWM / timers</text>
  <text x="507" y="305" text-anchor="middle" class="small">I2C / SPI / UART</text>
  <text x="507" y="333" text-anchor="middle" class="small">SWD / DFU / bootloader</text>

  <path d="M277 257 H382" class="link"/>
  <text x="305" y="243" class="small">USB / UART / CAN</text>

  <rect x="735" y="58" width="190" height="72" class="input"/>
  <text x="830" y="88" text-anchor="middle" class="label">Thermistors</text>
  <text x="830" y="113" text-anchor="middle" class="small">ADC inputs</text>

  <rect x="735" y="160" width="190" height="72" class="input"/>
  <text x="830" y="190" text-anchor="middle" class="label">Endstops / sensors</text>
  <text x="830" y="215" text-anchor="middle" class="small">GPIO / I2C / SPI</text>

  <rect x="735" y="270" width="190" height="72" class="output"/>
  <text x="830" y="300" text-anchor="middle" class="label">Fans / LEDs</text>
  <text x="830" y="325" text-anchor="middle" class="small">MOSFET outputs</text>

  <rect x="735" y="380" width="190" height="72" class="output"/>
  <text x="830" y="410" text-anchor="middle" class="label">Heater / SSR</text>
  <text x="830" y="435" text-anchor="middle" class="small">protected power path</text>

  <path d="M632 178 C680 150 690 96 735 94" class="signal"/>
  <path d="M632 230 C680 215 690 198 735 196" class="signal"/>
  <path d="M632 302 H735" class="power"/>
  <path d="M632 335 C685 355 690 416 735 416" class="power"/>

  <text x="388" y="438" class="small">STM32 controls pins. Board hardware switches real power.</text>
  <text x="612" y="485" class="small">Check exact chip, pinout, flashing method and load ratings.</text>
</svg>
