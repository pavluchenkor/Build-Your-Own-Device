<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 device architecture</title>
  <desc id="desc">ESP32 receives power, reads sensors and controls external drivers. Loads are powered separately through MOSFET, SSR or servo power supply.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .board { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .module { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .power { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .load { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 12; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .wire { fill: none; stroke: #1f2937; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .powerwire { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .gnd { fill: none; stroke: #4b5563; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="980" height="520" fill="#ffffff"/>

  <rect x="375" y="170" width="230" height="180" class="board"/>
  <text x="490" y="215" text-anchor="middle" class="label">ESP32 dev board</text>
  <text x="490" y="245" text-anchor="middle" class="small">3.3V logic GPIO</text>
  <text x="490" y="270" text-anchor="middle" class="small">Wi-Fi / Bluetooth</text>
  <text x="490" y="295" text-anchor="middle" class="small">I2C / SPI / UART / ADC / PWM</text>

  <rect x="65" y="80" width="185" height="82" class="module"/>
  <text x="158" y="114" text-anchor="middle" class="label">Sensors</text>
  <text x="158" y="140" text-anchor="middle" class="small">I2C / ADC / GPIO</text>

  <rect x="65" y="225" width="185" height="82" class="module"/>
  <text x="158" y="259" text-anchor="middle" class="label">OLED / RFID</text>
  <text x="158" y="285" text-anchor="middle" class="small">I2C / SPI / UART</text>

  <rect x="65" y="370" width="185" height="82" class="power"/>
  <text x="158" y="404" text-anchor="middle" class="label">5V USB / VIN</text>
  <text x="158" y="430" text-anchor="middle" class="small">stable power input</text>

  <rect x="735" y="70" width="180" height="82" class="module"/>
  <text x="825" y="104" text-anchor="middle" class="label">MOSFET driver</text>
  <text x="825" y="130" text-anchor="middle" class="small">DC fan / LED / heater</text>

  <rect x="735" y="210" width="180" height="82" class="module"/>
  <text x="825" y="244" text-anchor="middle" class="label">SSR / relay</text>
  <text x="825" y="270" text-anchor="middle" class="small">AC load control</text>

  <rect x="735" y="350" width="180" height="82" class="module"/>
  <text x="825" y="384" text-anchor="middle" class="label">Servo</text>
  <text x="825" y="410" text-anchor="middle" class="small">separate 5V/6V power</text>

  <path d="M250 121 C310 121 315 190 375 210" class="wire"/>
  <path d="M250 266 H375" class="wire"/>
  <path d="M250 411 C310 411 315 330 375 315" class="powerwire"/>

  <path d="M605 215 C660 190 675 115 735 111" class="signal"/>
  <path d="M605 260 H735" class="signal"/>
  <path d="M605 305 C660 330 675 385 735 391" class="signal"/>

  <rect x="735" y="468" width="180" height="34" class="load"/>
  <text x="825" y="491" text-anchor="middle" class="small">Loads use external power</text>
  <path d="M825 432 V468" class="powerwire"/>

  <path d="M725 442 H620 V350" class="gnd"/>
  <text x="626" y="440" class="small">common GND for low-voltage drivers</text>

  <text x="380" y="395" class="small">GPIO controls drivers. It does not power loads.</text>
</svg>
