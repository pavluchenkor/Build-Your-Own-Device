<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">USB UART adapter wiring</title>
  <desc id="desc">A computer connects to a USB UART adapter. Adapter TX crosses to device RX, adapter RX crosses to device TX, and grounds are connected. VCC is shown as optional.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .host { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .adapter { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
      .device { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .usb { fill: none; stroke: #7c3aed; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .tx { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .rx { fill: none; stroke: #0891b2; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .gnd { fill: none; stroke: #4b5563; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .vcc { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="500" fill="#ffffff"/>

  <rect x="55" y="160" width="190" height="145" class="host"/>
  <text x="150" y="204" text-anchor="middle" class="label">Computer</text>
  <text x="150" y="232" text-anchor="middle" class="small">USB port</text>
  <text x="150" y="260" text-anchor="middle" class="small">terminal / flasher</text>

  <rect x="360" y="95" width="240" height="270" class="adapter"/>
  <text x="480" y="135" text-anchor="middle" class="label">USB-UART adapter</text>
  <text x="480" y="164" text-anchor="middle" class="small">CH340 / CP2102 / FTDI</text>
  <text x="405" y="215" class="small">TX</text>
  <text x="405" y="255" class="small">RX</text>
  <text x="405" y="295" class="small">GND</text>
  <text x="405" y="335" class="small">VCC optional</text>

  <rect x="735" y="140" width="190" height="190" class="device"/>
  <text x="830" y="183" text-anchor="middle" class="label">Target board</text>
  <text x="830" y="211" text-anchor="middle" class="small">MCU / module</text>
  <text x="760" y="250" class="small">RX</text>
  <text x="760" y="290" class="small">TX</text>
  <text x="760" y="330" class="small">GND</text>

  <path d="M245 232 H360" class="usb"/>
  <text x="278" y="218" class="small">USB</text>

  <path d="M600 212 C650 212 690 250 735 250" class="tx"/>
  <path d="M735 290 C690 290 650 252 600 252" class="rx"/>
  <path d="M600 292 H735" class="gnd"/>
  <path d="M600 332 C660 360 700 365 735 365" class="vcc"/>

  <rect x="690" y="375" width="250" height="72" class="warn"/>
  <text x="815" y="404" text-anchor="middle" class="small">Connect VCC only when</text>
  <text x="815" y="427" text-anchor="middle" class="small">you know the board needs it.</text>

  <text x="70" y="455" class="small">Check 3.3V / 5V signal level before connecting TX/RX.</text>
</svg>
