<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">I2C shared bus</title>
  <desc id="desc">A controller shares SDA and SCL lines with multiple I2C devices. Pull-up resistors connect the lines to the logic voltage, and all devices share ground.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .ctrl { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
      .dev { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .pull { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .sda { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .scl { fill: none; stroke: #0891b2; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .gnd { fill: none; stroke: #4b5563; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .vcc { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .tap { stroke: #1f2937; stroke-width: 3; }
    </style>
  </defs>

  <rect width="980" height="520" fill="#ffffff"/>

  <rect x="55" y="190" width="210" height="150" class="ctrl"/>
  <text x="160" y="232" text-anchor="middle" class="label">Controller</text>
  <text x="160" y="260" text-anchor="middle" class="small">ESP32 / RP2040 / STM32</text>
  <text x="160" y="288" text-anchor="middle" class="small">I2C master</text>

  <path d="M265 230 H885" class="sda"/>
  <path d="M265 285 H885" class="scl"/>
  <path d="M265 340 H885" class="gnd"/>
  <text x="300" y="216" class="small">SDA data</text>
  <text x="300" y="272" class="small">SCL clock</text>
  <text x="300" y="364" class="small">GND common</text>

  <rect x="380" y="70" width="150" height="70" class="pull"/>
  <text x="455" y="99" text-anchor="middle" class="small">Pull-ups</text>
  <text x="455" y="123" text-anchor="middle" class="small">to logic V+</text>
  <path d="M430 140 V230" class="vcc"/>
  <path d="M480 140 V285" class="vcc"/>
  <text x="540" y="112" class="small">3.3V or 5V - check before connecting</text>

  <rect x="395" y="390" width="150" height="85" class="dev"/>
  <text x="470" y="421" text-anchor="middle" class="label">OLED</text>
  <text x="470" y="447" text-anchor="middle" class="small">0x3C</text>
  <line x1="470" y1="390" x2="470" y2="230" class="tap"/>
  <line x1="490" y1="390" x2="490" y2="285" class="tap"/>
  <line x1="510" y1="390" x2="510" y2="340" class="tap"/>

  <rect x="600" y="390" width="150" height="85" class="dev"/>
  <text x="675" y="421" text-anchor="middle" class="label">Sensor</text>
  <text x="675" y="447" text-anchor="middle" class="small">0x76</text>
  <line x1="675" y1="390" x2="675" y2="230" class="tap"/>
  <line x1="695" y1="390" x2="695" y2="285" class="tap"/>
  <line x1="715" y1="390" x2="715" y2="340" class="tap"/>

  <rect x="805" y="390" width="150" height="85" class="dev"/>
  <text x="880" y="421" text-anchor="middle" class="label">Expander</text>
  <text x="880" y="447" text-anchor="middle" class="small">0x20</text>
  <line x1="840" y1="390" x2="840" y2="230" class="tap"/>
  <line x1="860" y1="390" x2="860" y2="285" class="tap"/>
  <line x1="880" y1="390" x2="880" y2="340" class="tap"/>

  <text x="55" y="472" class="small">Devices can share SDA/SCL only when their addresses do not conflict.</text>
</svg>
