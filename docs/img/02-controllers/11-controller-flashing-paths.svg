<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Controller flashing paths</title>
  <desc id="desc">Different firmware flashing paths from a computer to a controller: UF2 mass storage, USB DFU, USB UART, ST-LINK SWD, SD card, and CAN bootloader.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .host { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .target { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
      .path { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="540" fill="#ffffff"/>

  <rect x="55" y="190" width="200" height="140" class="host"/>
  <text x="155" y="232" text-anchor="middle" class="label">Computer / host</text>
  <text x="155" y="260" text-anchor="middle" class="small">builds or stores</text>
  <text x="155" y="286" text-anchor="middle" class="small">firmware file</text>

  <rect x="735" y="190" width="200" height="140" class="target"/>
  <text x="835" y="232" text-anchor="middle" class="label">Controller</text>
  <text x="835" y="260" text-anchor="middle" class="small">MCU flash memory</text>
  <text x="835" y="286" text-anchor="middle" class="small">runs firmware</text>

  <rect x="360" y="45" width="250" height="52" class="path"/>
  <text x="485" y="77" text-anchor="middle" class="small">UF2 / BOOTSEL mass storage</text>
  <path d="M255 215 C315 110 330 72 360 72" class="line"/>
  <path d="M610 72 C675 110 700 185 735 215" class="line"/>

  <rect x="360" y="120" width="250" height="52" class="path"/>
  <text x="485" y="152" text-anchor="middle" class="small">USB DFU bootloader</text>
  <path d="M255 235 C320 160 330 146 360 146" class="line"/>
  <path d="M610 146 C675 165 700 205 735 235" class="line"/>

  <rect x="360" y="195" width="250" height="52" class="path"/>
  <text x="485" y="227" text-anchor="middle" class="small">USB-UART / serial bootloader</text>
  <path d="M255 260 H360" class="line"/>
  <path d="M610 221 H735" class="line"/>

  <rect x="360" y="270" width="250" height="52" class="path"/>
  <text x="485" y="302" text-anchor="middle" class="small">ST-LINK / SWD programmer</text>
  <path d="M255 285 C320 300 330 296 360 296" class="line"/>
  <path d="M610 296 C675 300 700 285 735 285" class="line"/>

  <rect x="360" y="345" width="250" height="52" class="path"/>
  <text x="485" y="377" text-anchor="middle" class="small">SD card bootloader</text>
  <path d="M255 308 C320 360 330 371 360 371" class="line"/>
  <path d="M610 371 C675 360 700 312 735 308" class="line"/>

  <rect x="360" y="420" width="250" height="52" class="path"/>
  <text x="485" y="452" text-anchor="middle" class="small">CAN bootloader</text>
  <path d="M255 328 C315 455 330 446 360 446" class="line"/>
  <path d="M610 446 C680 455 700 330 735 328" class="line"/>

  <rect x="63" y="430" width="260" height="60" class="warn"/>
  <text x="193" y="456" text-anchor="middle" class="small">Correct path depends on</text>
  <text x="193" y="478" text-anchor="middle" class="small">board, bootloader and MCU.</text>
</svg>
