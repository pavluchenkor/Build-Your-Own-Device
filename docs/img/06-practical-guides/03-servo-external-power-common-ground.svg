<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Подключение сервопривода с отдельным питанием и общей землей</title>
  <desc id="desc">Схема показывает контроллер, отдельный 5V или 6V источник питания, сервопривод, общий GND и сигнальный провод.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
      .servo { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .psu { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .wire-pos { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gnd { fill: none; stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { font-family: Arial, sans-serif; font-size: 18px; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .pin { fill: #e2e8f0; stroke: #475569; stroke-width: 1.5; }
      .cap { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="70" y="70" width="200" height="120" class="box"/>
  <text x="170" y="115" text-anchor="middle" class="label">Controller</text>
  <circle cx="125" cy="160" r="9" class="pin"/>
  <text x="125" y="165" text-anchor="middle" class="small">GND</text>
  <circle cx="220" cy="160" r="9" class="pin"/>
  <text x="220" y="165" text-anchor="middle" class="small">PWM</text>

  <rect x="70" y="265" width="200" height="100" class="psu"/>
  <text x="170" y="305" text-anchor="middle" class="label">5V/6V PSU</text>
  <circle cx="120" cy="335" r="9" class="pin"/>
  <text x="120" y="340" text-anchor="middle" class="small">+</text>
  <circle cx="220" cy="335" r="9" class="pin"/>
  <text x="220" y="340" text-anchor="middle" class="small">-</text>

  <rect x="620" y="100" width="210" height="180" class="servo"/>
  <text x="725" y="145" text-anchor="middle" class="label">Servo</text>
  <circle cx="650" cy="230" r="9" class="pin"/>
  <text x="650" y="235" text-anchor="middle" class="small">+</text>
  <circle cx="725" cy="230" r="9" class="pin"/>
  <text x="725" y="235" text-anchor="middle" class="small">GND</text>
  <circle cx="800" cy="230" r="9" class="pin"/>
  <text x="800" y="235" text-anchor="middle" class="small">SIG</text>
  <circle cx="725" cy="180" r="28" fill="none" stroke="#c2410c" stroke-width="2"/>
  <path d="M725 180 L750 170" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
  <text x="725" y="265" text-anchor="middle" class="small">power + ground + signal</text>

  <path class="wire-pos" d="M120 335 V395 H650 V230"/>
  <text x="385" y="382" text-anchor="middle" class="small">servo power from separate supply</text>

  <path class="wire-gnd" d="M220 335 V405 H725 V230"/>
  <path class="wire-gnd" d="M125 160 V405"/>
  <text x="425" y="424" text-anchor="middle" class="small">common GND: controller GND + servo PSU minus + servo GND</text>

  <path class="wire-sig" d="M220 160 H520 V230 H800"/>
  <text x="505" y="148" text-anchor="middle" class="small">control signal only</text>

  <path class="cap" d="M500 330 V370"/>
  <path class="cap" d="M520 330 V370"/>
  <text x="510" y="310" text-anchor="middle" class="small">optional capacitor</text>
  <path class="wire-pos" d="M500 330 H650"/>
  <path class="wire-gnd" d="M520 370 H725"/>
</svg>
