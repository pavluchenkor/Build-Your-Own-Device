<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">STL to print workflow: 3D model → STL → slicer → G-code → printer</title>
  <desc id="desc">Step-by-step flow from 3D CAD model to physical print, showing the role of STL format and slicer software.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#475569"/>
    </marker>
    <style>
      .step { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .step1 { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .step2 { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .step3 { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .step4 { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .step5 { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .arrow-line { stroke: #475569; stroke-width: 3; fill: none; }
      .label { font: bold 16px Arial, sans-serif; fill: #1e293b; }
      .sublabel { font: bold 13px Arial, sans-serif; }
      .text { font: 13px Arial, sans-serif; fill: #475569; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" class="label" font-size="20">From 3D Model to Physical Part</text>

  <!-- Step 1: 3D CAD model -->
  <rect x="20" y="70" width="155" height="160" rx="10" class="step1"/>
  <text x="97" y="100" text-anchor="middle" class="sublabel" fill="#1d4ed8">Step 1</text>
  <text x="97" y="120" text-anchor="middle" class="label" fill="#1e293b">3D Model</text>
  <text x="97" y="145" text-anchor="middle" class="text">CAD software:</text>
  <text x="97" y="162" text-anchor="middle" class="text">Fusion 360</text>
  <text x="97" y="179" text-anchor="middle" class="text">FreeCAD</text>
  <text x="97" y="196" text-anchor="middle" class="text">OpenSCAD</text>
  <text x="97" y="215" text-anchor="middle" class="small">or download .stl</text>

  <!-- Arrow 1→2 -->
  <path d="M175 150 L210 150" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="192" y="143" text-anchor="middle" class="small">export</text>

  <!-- Step 2: STL file -->
  <rect x="210" y="70" width="155" height="160" rx="10" class="step2"/>
  <text x="287" y="100" text-anchor="middle" class="sublabel" fill="#b45309">Step 2</text>
  <text x="287" y="120" text-anchor="middle" class="label" fill="#1e293b">STL File</text>
  <text x="287" y="145" text-anchor="middle" class="text">.stl format</text>
  <text x="287" y="168" text-anchor="middle" class="text">triangulated</text>
  <text x="287" y="188" text-anchor="middle" class="text">surface mesh</text>
  <text x="287" y="210" text-anchor="middle" class="small">no color, no material</text>

  <!-- Arrow 2→3 -->
  <path d="M365 150 L400 150" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="382" y="143" text-anchor="middle" class="small">open in</text>

  <!-- Step 3: Slicer -->
  <rect x="400" y="70" width="155" height="160" rx="10" class="step3"/>
  <text x="477" y="100" text-anchor="middle" class="sublabel" fill="#15803d">Step 3</text>
  <text x="477" y="120" text-anchor="middle" class="label" fill="#1e293b">Slicer</text>
  <text x="477" y="145" text-anchor="middle" class="text">Cura / PrusaSlicer</text>
  <text x="477" y="165" text-anchor="middle" class="text">OrcaSlicer</text>
  <text x="477" y="188" text-anchor="middle" class="text">layer height</text>
  <text x="477" y="205" text-anchor="middle" class="text">infill, supports</text>
  <text x="477" y="222" text-anchor="middle" class="text">material settings</text>

  <!-- Arrow 3→4 -->
  <path d="M555 150 L590 150" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="572" y="143" text-anchor="middle" class="small">slice</text>

  <!-- Step 4: G-code -->
  <rect x="590" y="70" width="155" height="160" rx="10" class="step4"/>
  <text x="667" y="100" text-anchor="middle" class="sublabel" fill="#7c3aed">Step 4</text>
  <text x="667" y="120" text-anchor="middle" class="label" fill="#1e293b">G-code</text>
  <text x="667" y="145" text-anchor="middle" class="text">.gcode file</text>
  <text x="667" y="168" text-anchor="middle" class="text">printer movement</text>
  <text x="667" y="188" text-anchor="middle" class="text">temperature</text>
  <text x="667" y="208" text-anchor="middle" class="text">fan speed</text>
  <text x="667" y="225" text-anchor="middle" class="small">via SD card / USB</text>

  <!-- Arrow 4→5 -->
  <path d="M745 150 L780 150" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="762" y="143" text-anchor="middle" class="small">print</text>

  <!-- Step 5: Physical part -->
  <rect x="780" y="70" width="160" height="160" rx="10" class="step5"/>
  <text x="860" y="100" text-anchor="middle" class="sublabel" fill="#b91c1c">Step 5</text>
  <text x="860" y="120" text-anchor="middle" class="label" fill="#1e293b">Printed Part</text>
  <text x="860" y="148" text-anchor="middle" class="text">layer-by-layer</text>
  <text x="860" y="168" text-anchor="middle" class="text">FDM printing</text>
  <text x="860" y="193" text-anchor="middle" class="text">PETG / ABS</text>
  <text x="860" y="210" text-anchor="middle" class="text">ASA / PLA</text>
  <text x="860" y="228" text-anchor="middle" class="small">housing, bracket, part</text>

  <!-- Bottom note -->
  <rect x="20" y="248" width="920" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="270" text-anchor="middle" class="text">STL is the universal exchange format: the slicer only needs the shape, not the CAD history or construction tree.</text>
  <text x="480" y="292" text-anchor="middle" class="text">Many ready-made parts for iDryer enclosures are distributed as .stl files — download and print directly.</text>
</svg>
